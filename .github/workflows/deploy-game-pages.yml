name: Deploy OUMAIMA game to GitHub Pages

on:
  push:
    branches:
      - claude/oumaima-level-game-9ihjoe
    paths:
      - 'game/**'
      - '.github/workflows/deploy-game-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload game folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'game'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
